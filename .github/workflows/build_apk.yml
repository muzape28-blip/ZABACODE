name: Build ZABACODE APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk

    steps:
    # Pinned to commit SHA for supply-chain trust (Fix #26)
    # Original: actions/checkout@v4 -> pinned to v4.2.2 SHA
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Install system deps
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip tar curl autoconf libtool pkg-config zlib1g-dev libncurses5 libffi-dev libssl-dev

    - name: Set up Java 17
      # Pinned: actions/setup-java@v4.7.0
      uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Python 3.10
      # Pinned: actions/setup-python@v5.3.0
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
      with:
        python-version: '3.10'

    - name: Install Buildozer & Cython
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --user buildozer==1.5.0 cython==0.29.33
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install Code Quality & Testing Dependencies (locked)
      run: |
        # Prefer locked file for reproducibility, fallback to dev file
        if [ -f requirements.lock ]; then
          python3 -m pip install -r requirements.lock
        else
          python3 -m pip install ruff mypy pytest pytest-cov
          python3 -m pip install -r requirements-dev.txt
        fi

    - name: Run Ruff Linter (critical - blocking)
      run: |
        ruff check . --select=E9,F821

    - name: Run Ruff Linter (full, non-blocking)
      run: |
        ruff check . --select=E,F,W,I --exit-zero || true

    - name: Run Mypy Type Checking on Core Modules (blocking)
      run: |
        mypy --ignore-missing-imports zabacode/core/security.py zabacode/core/executor.py zabacode/core/net.py zabacode/core/keystore.py zabacode/core/ai_provider.py zabacode/core/oracle.py

    - name: Mypy wider sweep (non-blocking)
      run: |
        mypy --ignore-missing-imports zabacode/ --exclude 'zabacode/(files|cache|logs|user_packages)/' || true

    - name: Verify No Unverified SSL Context (Security)
      run: |
        if grep -R "ssl._create_unverified_context" zabacode/ --exclude-dir=user_packages; then
          echo "❌ Found unverified SSL context — this reopens MITM/RCE hole!"
          exit 1
        else
          echo "✅ No unverified SSL context"
        fi

    - name: Verify Ace Editor Bundled (Offline-First)
      run: |
        ls -lh assets/vendor/ace/ace.js
        test -f assets/vendor/ace/ace.js && echo "✅ Ace bundled" || (echo "❌ Ace missing" && exit 1)
        for f in mode-python.js theme-tomorrow_night_eighties.js ext-settings_menu.js ext-language_tools.js ext-searchbox.js; do
          test -f assets/vendor/ace/$f && echo "✅ $f exists" || (echo "❌ $f missing" && exit 1)
        done

    - name: Verify Security Headers & Keystore & TLS (Security)
      run: |
        grep -q "Content-Security-Policy" zabacode/web_app.py && echo "✅ CSP present" || (echo "❌ CSP missing" && exit 1)
        grep -q "X-Content-Type-Options" zabacode/web_app.py && echo "✅ X-Content-Type-Options present"
        test -f zabacode/core/keystore.py && echo "✅ keystore.py exists"
        grep -q "certifi" buildozer.spec && echo "✅ certifi in buildozer.spec" || (echo "❌ certifi missing" && exit 1)
        grep -q "openssl" buildozer.spec && echo "✅ openssl in buildozer.spec"
        # Verify no CDN breaks offline-first
        if grep -q "cdnjs.cloudflare.com\|unpkg.com\|jsdelivr.net" templates/index.html; then
          echo "❌ External CDN found — breaks offline-first"
          exit 1
        else
          echo "✅ No external CDN"
        fi
        python3 -c "
        from zabacode.core.ai_provider import ALLOWED_PROVIDERS, PROVIDER_HANDLERS
        print(f'Providers: {sorted(ALLOWED_PROVIDERS)}')
        assert len(ALLOWED_PROVIDERS) >= 6
        print('✅ Provider registry OK')
        "

    - name: Run Unit Tests with Pytest
      run: |
        python3 -m pytest -v

    - name: Set up Android SDK
      # Pinned: android-actions/setup-android@v3 -> v3 commit
      uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        accept-android-sdk-licenses: true

    - name: Bridge cmdline-tools to legacy sdkmanager path & pre-install API 34
      run: |
        CMDLINE_TOOLS_DIR=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 1 -mindepth 1 -type d | head -n 1)
        mkdir -p "$ANDROID_SDK_ROOT/tools/bin"
        ln -sf "$CMDLINE_TOOLS_DIR/bin/sdkmanager" "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"
        ln -sf "$CMDLINE_TOOLS_DIR/bin/avdmanager" "$ANDROID_SDK_ROOT/tools/bin/avdmanager" || true
        ls -la "$ANDROID_SDK_ROOT/tools/bin/"
        yes | "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" --licenses || true
        "$ANDROID_SDK_ROOT/tools/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

    - name: Cache Buildozer directory
      # Pinned: actions/cache@v4.2.2
      uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK
      # Pinned: actions/upload-artifact@v4.4.0
      uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
      with:
        name: Zabacode-ARMv7
        path: bin/*.apk
